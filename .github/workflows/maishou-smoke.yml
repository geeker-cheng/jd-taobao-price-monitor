name: Price source smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "haodanku_probe.py"
      - ".github/workflows/maishou-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Haodanku probe
        env:
          HAODANKU_API_KEY: ${{ secrets.HAODANKU_API_KEY }}
        run: python haodanku_probe.py

      - name: Show sanitized result
        if: always()
        run: |
          if [ -f haodanku-probe-result.json ]; then
            cat haodanku-probe-result.json
          else
            echo "haodanku-probe-result.json was not produced"
          fi

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haodanku-probe-result
          path: haodanku-probe-result.json
          if-no-files-found: warn
          retention-days: 3
