name: Maishou API smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "smoke_test.py"
      - ".github/workflows/maishou-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Maishou smoke test
        run: python smoke_test.py

      - name: Show result
        if: always()
        run: |
          if [ -f smoke-result.json ]; then
            cat smoke-result.json
          else
            echo "smoke-result.json was not produced"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maishou-smoke-result
          path: smoke-result.json
          if-no-files-found: warn
          retention-days: 3
